<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lucerne · Shadow Reader</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Noto+Serif+SC:wght@400;500;600;700&display=swap');

    :root {
      --bg: #f3efe2;
      --bg-warm: #efe5cf;
      --card: #ece6d6;
      --card-2: #f7eed7;
      --ink: #2c2722;
      --ink-2: #4a3826;
      --muted: #8a7f6c;
      --line: #d8cfb8;
      --accent: #2b6cb0;
      --accent-warm: #c1600a;
      --good: #2b6cb0;
      --warn: #b8860b;
      --bad: #c1600a;
      --shadow: 0 2px 8px rgba(74, 56, 38, 0.08);
      --font-display: 'EB Garamond', Georgia, 'Times New Roman', serif;
      --font-body: 'EB Garamond', Georgia, serif;
      --font-cjk: 'Noto Serif SC', 'EB Garamond', Georgia, serif;
      --font-mono: ui-monospace, 'SFMono-Regular', Menlo, monospace;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }

    body {
      font-family: var(--font-body);
      color: var(--ink);
      background: var(--bg);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px 64px;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      background:
        radial-gradient(circle at 20% 30%, rgba(184, 134, 11, 0.04) 0%, transparent 50%),
        radial-gradient(circle at 80% 70%, rgba(139, 90, 43, 0.03) 0%, transparent 50%);
    }

    .brand {
      position: relative;
      z-index: 1;
      font-family: var(--font-display);
      font-size: 18px;
      font-weight: 600;
      letter-spacing: 0.04em;
      color: var(--ink);
      margin-bottom: 18px;
    }
    .brand i { font-style: italic; font-weight: 400; color: var(--muted); }

    .card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 760px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 4px;
      padding: 32px;
      box-shadow: var(--shadow);
    }

    h1 {
      font-family: var(--font-display);
      font-weight: 600;
      font-size: 28px;
      margin: 0 0 6px;
      color: var(--ink);
      text-align: center;
    }
    .subtitle {
      font-family: var(--font-cjk);
      color: var(--muted);
      font-size: 15px;
      text-align: center;
      margin-bottom: 24px;
    }

    .url-form {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
      justify-content: center;
    }
    .url-form input[type="text"] {
      flex: 1 1 320px;
      min-width: 240px;
      padding: 10px 12px;
      font-family: var(--font-body);
      font-size: 15px;
      border: 1px solid var(--line);
      border-radius: 4px;
      background: #fff;
      color: var(--ink);
    }
    .url-form select {
      padding: 10px 12px;
      font-family: var(--font-body);
      font-size: 15px;
      border: 1px solid var(--line);
      border-radius: 4px;
      background: #fff;
      color: var(--ink);
    }

    button {
      font-family: var(--font-display);
      border: none;
      border-radius: 6px;
      padding: 10px 20px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: filter 0.15s, transform 0.1s, background 0.15s;
    }
    button:disabled { opacity: 0.45; cursor: not-allowed; }
    button:active:not(:disabled) { transform: scale(0.97); }
    .btn-primary { background: var(--ink); color: var(--card-2); }
    .btn-primary:hover:not(:disabled) { background: var(--accent); color: #fff; }
    .btn-secondary { background: transparent; color: var(--ink); border: 1px solid var(--line); }
    .btn-secondary:hover:not(:disabled) { border-color: var(--muted); background: rgba(255,255,255,0.25); }
    .btn-play { background: var(--good); color: #fff; }
    .btn-play:hover:not(:disabled) { filter: brightness(1.08); }
    .btn-danger { background: var(--bad); color: #fff; }
    .btn-danger:hover:not(:disabled) { filter: brightness(1.08); }

    .video-info {
      margin-top: 22px;
      display: flex;
      gap: 16px;
      align-items: flex-start;
      padding-top: 20px;
      border-top: 1px solid var(--line);
    }
    .video-info img { width: 160px; border-radius: 4px; border: 1px solid var(--line); }
    .video-info .meta { flex: 1; }
    .video-info .title { font-family: var(--font-display); font-size: 18px; font-weight: 600; margin-bottom: 6px; }
    .video-info .author { color: var(--muted); font-size: 14px; margin-bottom: 12px; }
    .video-info .langs { color: var(--muted); font-size: 13px; margin-bottom: 12px; }

    .status {
      text-align: center;
      color: var(--muted);
      min-height: 22px;
      margin-top: 10px;
      font-family: var(--font-cjk);
      font-size: 14px;
    }

    .practice {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 1200px;
    }

    .practice-grid {
      display: grid;
      grid-template-columns: 260px 1fr 300px;
      gap: 18px;
      align-items: start;
    }
    @media (max-width: 980px) {
      .practice-grid { grid-template-columns: 1fr; }
      .panel { max-height: none; }
    }

    .panel {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 4px;
      padding: 16px;
      box-shadow: var(--shadow);
      max-height: calc(100vh - 120px);
      overflow: auto;
    }
    .panel h3 {
      font-family: var(--font-display);
      font-size: 15px;
      margin: 0 0 12px;
      color: var(--ink);
      letter-spacing: 0.04em;
    }

    .center { display: flex; flex-direction: column; gap: 14px; }

    .player-wrap {
      position: relative;
      padding-bottom: 56.25%;
      height: 0;
      background: #000;
      border-radius: 4px;
      overflow: hidden;
      border: 1px solid var(--line);
    }
    .player-wrap iframe {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
    }

    .subtitle-box {
      background: var(--card-2);
      border: 1px solid var(--line);
      border-radius: 4px;
      padding: 18px 20px;
      font-family: var(--font-display);
      font-size: 24px;
      line-height: 1.7;
      text-align: center;
      min-height: 90px;
    }
    .subtitle-word {
      display: inline-block;
      padding: 2px 6px;
      margin: 1px;
      border-radius: 6px;
      cursor: pointer;
      border: 2px solid transparent;
      transition: background 0.15s, transform 0.1s;
    }
    .subtitle-word:hover { background: rgba(43,108,176,0.12); }
    .subtitle-word.active { background: var(--accent); color: #fff; }
    .subtitle-word.good { border-color: var(--good); }
    .subtitle-word.warn { border-color: var(--warn); }
    .subtitle-word.bad { border-color: var(--bad); }

    .controls {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .sentence-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .transcript-list {
      font-size: 14px;
      line-height: 1.55;
      color: var(--ink-2);
    }
    .sentence-item {
      display: inline;
      padding: 2px 4px;
      border-radius: 4px;
      cursor: pointer;
      border: 1px solid transparent;
      color: var(--ink-2);
    }
    .sentence-item:hover { background: var(--bg-warm); }
    .sentence-item.current { background: var(--bg-warm); border-color: var(--accent); }
    .sentence-item .idx { color: var(--muted); font-family: var(--font-mono); margin-right: 4px; }
    .sentence-sep { display: inline; color: var(--muted); margin: 0 4px; }

    .analysis-empty { color: var(--muted); font-size: 14px; }
    .overall-score {
      font-family: var(--font-display);
      font-size: 42px;
      font-weight: 700;
      text-align: center;
      margin-bottom: 12px;
    }
    .word-result {
      background: var(--card-2);
      border: 1px solid var(--line);
      border-radius: 4px;
      padding: 10px 12px;
      margin-bottom: 8px;
    }
    .word-result-header {
      display: flex;
      align-items: baseline;
      gap: 8px;
      margin-bottom: 4px;
    }
    .word-result-word { font-weight: 700; font-size: 17px; }
    .word-result-ipa { color: var(--muted); font-family: var(--font-mono); font-size: 12px; }
    .word-result-score { margin-left: auto; font-weight: 700; color: var(--accent-warm); }

    .word-detail {
      background: var(--card-2);
      border: 1px solid var(--line);
      border-radius: 4px;
      padding: 12px;
    }
    .word-detail h4 { margin: 0 0 8px; font-family: var(--font-display); font-size: 17px; }
    .word-detail .ipa { color: var(--muted); font-family: var(--font-mono); font-size: 13px; margin-bottom: 10px; }
    .word-detail .mini-btns { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
    .word-detail .mini-btns button { padding: 5px 10px; font-size: 13px; }

    .tip-box {
      margin-top: 8px;
      padding: 10px 12px;
      border-radius: 0 6px 6px 0;
      background: rgba(43, 108, 176, 0.06);
      border-left: 3px solid var(--accent);
    }
    .tip-box h4 { margin: 0 0 6px; font-size: 13px; font-family: var(--font-display); }
    .tip-box p { margin: 3px 0; font-size: 13px; color: var(--ink-2); }
    .tip-box .label { color: var(--muted); font-family: var(--font-cjk); }

    .mouth-diagrams {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin: 8px 0;
    }
    .mouth-diagram-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }
    .mouth-diagram-label { font-size: 11px; font-weight: 600; font-family: var(--font-cjk); }
    .mouth-diagram-label.correct { color: var(--good); }
    .mouth-diagram-label.user { color: var(--bad); }
    .mouth-diagram {
      max-height: 120px;
      width: auto;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 4px;
      padding: 4px;
    }

    .history-section {
      margin-top: 18px;
      padding-top: 14px;
      border-top: 1px solid var(--line);
    }
    .history-section h4 {
      font-family: var(--font-display);
      font-size: 14px;
      margin: 0 0 10px;
      color: var(--ink);
    }
    .history-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 0;
      border-bottom: 1px solid var(--line);
      font-size: 13px;
    }
    .history-item:last-child { border-bottom: none; }
    .history-score { font-weight: 700; font-size: 15px; min-width: 32px; }
    .history-time { color: var(--muted); flex: 1; }
    .history-item button { padding: 4px 8px; font-size: 12px; }

    .recording-dot {
      width: 10px; height: 10px;
      border-radius: 50%;
      background: var(--bad);
      display: inline-block;
      margin-right: 8px;
      animation: pulse 1s infinite;
    }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

    .hidden { display: none !important; }
    .muted { color: var(--muted); }

    .top-nav {
      position: relative;
      z-index: 2;
      display: flex;
      gap: 8px;
      margin-bottom: 18px;
    }
    .top-nav button {
      background: transparent;
      border: 1px solid var(--line);
      color: var(--ink-2);
      padding: 7px 16px;
      font-size: 14px;
      font-weight: 500;
    }
    .top-nav button.active {
      background: var(--ink);
      color: var(--card-2);
      border-color: var(--ink);
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
      gap: 12px;
      margin-bottom: 24px;
    }
    .stat-card {
      background: var(--card-2);
      border: 1px solid var(--line);
      border-radius: 4px;
      padding: 14px 10px;
      text-align: center;
    }
    .stat-value {
      font-family: var(--font-display);
      font-size: 28px;
      font-weight: 700;
      color: var(--accent);
      line-height: 1;
      margin-bottom: 4px;
    }
    .stat-label {
      font-family: var(--font-cjk);
      font-size: 12px;
      color: var(--muted);
    }

    .recent-videos {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 14px;
    }
    .video-card {
      background: var(--card-2);
      border: 1px solid var(--line);
      border-radius: 4px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .video-card img {
      width: 100%;
      aspect-ratio: 16 / 9;
      object-fit: cover;
      display: block;
      border-bottom: 1px solid var(--line);
    }
    .video-card .meta {
      padding: 12px;
      flex: 1;
      display: flex;
      flex-direction: column;
    }
    .video-card .title {
      font-family: var(--font-display);
      font-size: 15px;
      font-weight: 600;
      line-height: 1.3;
      margin-bottom: 8px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .video-card .progress {
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 10px;
    }
    .video-card .progress-bar {
      height: 5px;
      background: var(--line);
      border-radius: 3px;
      margin-top: 5px;
      overflow: hidden;
    }
    .video-card .progress-bar > div {
      height: 100%;
      background: var(--good);
    }
    .video-card button {
      margin-top: auto;
      width: 100%;
      padding: 7px 0;
      font-size: 14px;
    }
    .empty-state {
      text-align: center;
      color: var(--muted);
      font-family: var(--font-cjk);
      font-size: 14px;
      padding: 24px;
    }
  </style>
  <script src="https://www.youtube.com/iframe_api"></script>
</head>
<body>
  <div class="brand">Lucerne · <i>Shadow Reader</i></div>

  <nav class="top-nav" id="topNav">
    <button class="active" data-view="landing">输入链接</button>
    <button data-view="dashboard">总览</button>
  </nav>

  <div class="card landing" id="landing">
    <h1>YouTube 影子跟读</h1>
    <div class="subtitle">贴一个 YouTube 链接，逐句跟读并点评发音</div>
    <div class="url-form">
      <input id="urlInput" type="text" placeholder="https://www.youtube.com/watch?v=..." />
      <select id="langSelect">
        <option value="fr-fr" selected>Français</option>
        <option value="en-us">English</option>
      </select>
      <button id="btnLoad" class="btn-primary">加载</button>
    </div>
    <div class="status" id="landingStatus"></div>
    <div id="videoInfo" class="video-info hidden"></div>
  </div>

  <div class="card dashboard hidden" id="dashboard">
    <h1>练习总览</h1>
    <div class="subtitle">看看这段时间练了多少</div>
    <div class="stats-grid" id="statsGrid"></div>
    <h3 style="font-family: var(--font-display); font-size: 16px; margin: 0 0 12px;">最近练习</h3>
    <div class="recent-videos" id="recentVideos"></div>
  </div>

  <div class="practice hidden" id="practice">
    <div class="practice-grid">
      <aside class="panel" id="leftPanel">
        <h3>全文</h3>
        <div id="sentenceList" class="sentence-list transcript-list"></div>
      </aside>
      <main class="center">
        <div class="player-wrap">
          <div id="player"></div>
        </div>
        <div class="subtitle-box" id="subtitleBox">
          <span class="muted">加载中…</span>
        </div>
        <div class="controls" id="practiceControls">
          <button id="btnPlaySource" class="btn-secondary">▶ 原句</button>
          <button id="btnRecord" class="btn-primary">🎤 跟读</button>
          <button id="btnPlayRef" class="btn-secondary">🔊 标准音</button>
          <button id="btnPlayUser" class="btn-secondary" disabled>🎧 我的</button>
          <button id="btnRepeat" class="btn-danger">↻ 重读 (r)</button>
          <button id="btnContinue" class="btn-play">继续 (c)</button>
        </div>
        <div class="status" id="practiceStatus">准备</div>
      </main>
      <aside class="panel" id="rightPanel">
        <h3>分析</h3>
        <div id="analysisPanel"><p class="analysis-empty">跟读后会显示逐词分析</p></div>
      </aside>
    </div>
  </div>

  <script src="/static/app.js?v=10"></script>
</body>
</html>
